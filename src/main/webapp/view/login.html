<div style="width:300px; margin:auto; margin-top:80px;">
    <h2>Login</h2>

    <form ng-submit="vm.login()">
        <label>Email</label><br>
        <input type="email" ng-model="vm.user.email" class="form-control" required>
        <br>
        <label>Senha</label><br>
        <input type="password" ng-model="vm.user.senha" class="form-control" required>

        <button type="submit">Entrar</button>
    </form>
    <p style="color:red;" ng-if="vm.error">{{ vm.error }}</p>
</div>
